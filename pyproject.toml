# SPDX-License-Identifier: MIT
[project]
name = "erpnext_mcp"
authors = [{ name = "Tim Polehn", email = "polehntim@gmail.com" }]
description = "Model Context Protocol (MCP) server for ERPNext, as a Frappe app."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
license = { text = "MIT" }
keywords = ["frappe", "erpnext", "mcp", "model-context-protocol", "ai"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Framework :: Frappe",
]

# The MCP wire protocol is JSON-RPC 2.0 over HTTP, which this app speaks with the
# standard library — pulling in the `mcp` SDK would add an asyncio server runtime
# that a Frappe/Werkzeug (synchronous WSGI) request never uses.
#
# The two below arrived in v0.12.0 with field boundaries, and they are the only
# runtime dependencies beyond Frappe/ERPNext itself. Both do geometry this app
# has no business reimplementing: shapely decides whether a polygon is valid and
# whether a point is inside it, and h3 turns a shape into an index a bucket log
# or a crew track can be joined against.
#
# THEY ARE IMPORTED DEFENSIVELY ANYWAY. A bench that somehow lacks them loses the
# five geospatial tools — which say so by name, with the pip command to fix it —
# rather than failing to load the other hundred and sixteen. That is the same
# promise the rest of the app makes: installing it cannot break a site.
# The third arrived in v0.17.0 with the mobile login QR. `segno` is pure Python
# with no dependency of its own — which is why it and not `qrcode`, whose PNG
# writer needs Pillow. It produces only the MODULE MATRIX here; the PNG is
# written by `render/qr.py` in thirty lines of zlib, so the image an operator
# archives is byte-identical whichever encoder a bench happens to have.
#
# ALL THREE ARE IMPORTED DEFENSIVELY. A bench missing shapely or h3 loses the
# five geospatial tools; a bench missing every QR encoder loses exactly one —
# `generate_mobile_login_qr` — and each says so BY NAME with the pip command to
# fix it, rather than failing to load the other two hundred. `qrcode` is
# accepted in segno's place where a bench already has it. That is the same
# promise the rest of the app makes: installing it cannot break a site.
dependencies = [
  "shapely>=2.0",
  "h3>=4.0.0",
  "segno>=1.5",
]

[project.urls]
Homepage = "https://github.com/polehntim-commits/erpnext_mcp"
Source = "https://github.com/polehntim-commits/erpnext_mcp"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "erpnext_mcp"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
  "B017", # assertRaises(Exception)
  "B023", # function definition does not bind loop variable
  "E101", # indentation contains mixed spaces and tabs
  "E501", # line too long
  "F403", # can't detect undefined names from star imports
  "W191", # indentation contains tabs
  # The three below flag non-ASCII characters that "look like" ASCII ones. Every
  # occurrence in this app is deliberate typography in prose an operator reads:
  # an EN DASH in a numeric or regulation range (`1–30`, `§112.21–.30`), a
  # MULTIPLICATION SIGN in a dimension or a count (`8.5×11`, `600 × 800 KB`),
  # and a MINUS SIGN in arithmetic worked out in a comment. Rewriting them to
  # hyphens and lowercase `x` would make the text worse, and a `noqa` on each of
  # the sixteen would be more noise than the rules are worth.
  "RUF001", # ambiguous unicode character in a string
  "RUF002", # ambiguous unicode character in a docstring
  "RUF003", # ambiguous unicode character in a comment
]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
