# SPDX-License-Identifier: MIT
#
# The standalone suite only. It needs no bench, no MariaDB, no redis and no
# third-party packages — that is the whole point of the in-memory Frappe double
# in tests_standalone/harness.py, and it is what makes CI a few seconds rather
# than a bench build.
#
# The in-bench FrappeTestCase suite is NOT run here. Standing up Frappe, ERPNext
# and a site in Actions to run it would take minutes per push and still would not
# cover the sites that matter (an operator's own, with their own chart of
# accounts and their own apps). Run it yourself against a dev bench before
# tagging: `bench --site <site> run-tests --app erpnext_mcp`.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    name: standalone (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install werkzeug and jinja2
        # Neither is a declared dependency, and both arrive with Frappe in a real
        # bench. erpnext_mcp.mcp returns a werkzeug Response so it can control the
        # HTTP status; jinja2 is what renders the v0.14.0 check Print Format, and
        # the tests that render it are the only proof the template produces a page
        # rather than an UndefinedError the first time somebody presses Print.
        # Those tests skip themselves where jinja2 is absent, so the suite still
        # passes on a bare environment — installing it here is what stops that
        # skip from being permanent.
        run: python -m pip install --upgrade pip werkzeug jinja2

      - name: Run the standalone suite WITHOUT shapely, h3, reportlab and pypdf
        # Proves the graceful-degrade path: the geospatial tools, the two
        # tax-form PDF tools and v0.47.1's `render_i9_pdf` go unavailable and
        # nothing else notices.
        run: python -m unittest discover -s tests_standalone -t .

      - name: Install the optional-at-import dependencies
        # All four ARE declared dependencies (see pyproject.toml). They are
        # installed as a separate step so the previous job still proves the suite
        # passes without them — the six geospatial tools, the two tax-form PDF
        # tools and the I-9 PDF filler are supposed to go quietly unavailable on
        # a bench that lacks them, and a CI run that only ever saw them present
        # would never check that. The step after this one is what stops the skips
        # those tests take without reportlab or pypdf from becoming permanent.
        run: python -m pip install "shapely>=2.0" "h3>=4.0.0" "reportlab>=4.0" "pypdf>=4.0"

      - name: Run the standalone suite
        run: python -m unittest discover -s tests_standalone -t . -v

      - name: Check every source file carries its SPDX header
        run: |
          missing=0
          while IFS= read -r file; do
            if ! head -3 "$file" | grep -q "SPDX-License-Identifier: MIT"; then
              echo "missing SPDX header: $file"
              missing=1
            fi
          done < <(git ls-files '*.py' '*.js' '*.yml')
          exit $missing

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check .
      - run: ruff format --check .
